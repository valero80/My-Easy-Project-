    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                var sw = regs[i].active || regs[i].waiting || regs[i].installing;
                var scriptUrl = (sw && sw.scriptURL) || '';
                if (scriptUrl && !scriptUrl.endsWith('/offline-data-sw.js')) {
                  regs[i].unregister();
                }
              }
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                if (keys[j].indexOf('workbox') !== -1 || keys[j].indexOf('precache') !== -1) {
                  caches.delete(keys[j]);
                }
              }
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
